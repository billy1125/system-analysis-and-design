    <text x="110" y="459" fill="#111111">此預約無法報到（已報到、已取消或不是今天）</text>
    <text x="66" y="505" font-size="13" font-weight="bold" fill="#333333">[其他欄位或訪客證錯誤]</text>
    <text x="110" y="521" fill="#111111">對應的錯誤訊息</text>
    <text x="66" y="567" font-size="13" font-weight="bold" fill="#333333">[通過]</text>
    <text x="110" y="583" fill="#111111">登記完成：訪客證 V-xx（預約改為已報到）</text>
