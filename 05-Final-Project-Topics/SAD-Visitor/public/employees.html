<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>員工名單｜工廠訪客進出登記系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav"></header>
  <!-- UI-07 employee list (admin only) -->
  <main>
    <h1>員工名單</h1>
    <div id="msg" class="msg" hidden></div>
    <form id="employee-form" class="panel">
      <h2 id="form-title">新增員工</h2>
      <div class="row">
        <label>員工編號<input name="emp_no" maxlength="5" placeholder="E1234"></label>
        <label>姓名<input name="name" maxlength="20"></label>
        <label>部門<input name="department" maxlength="20"></label>
        <label>分機<input name="extension" maxlength="4"></label>
        <button type="submit" id="submit">新增</button>
        <button type="button" class="secondary" id="cancel" hidden>取消修改</button>
      </div>
    </form>
    <table>
      <thead>
        <tr><th>員工編號</th><th>姓名</th><th>部門</th><th>分機</th><th>狀態</th><th>操作</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script src="js/common.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>
