<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>工單明細｜工單分派管理系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav"></header>
  <!-- UI-05 work order detail and actions -->
  <main>
    <h1 id="title">工單明細</h1>
    <div id="msg" class="msg" hidden></div>
    <section class="panel">
      <h2>工單資料</h2>
      <dl class="detail" id="order"></dl>
    </section>
    <section class="panel">
      <h2>派工</h2>
      <dl class="detail" id="dispatch"></dl>
    </section>
    <section class="panel">
      <h2>生產回報</h2>
      <dl class="detail" id="report"></dl>
    </section>
    <div class="row" id="actions"></div>
    <form id="action-form" class="panel" hidden>
      <h2 id="form-title"></h2>
      <div id="form-fields"></div>
      <div class="row">
        <button type="submit">送出</button>
        <button type="button" class="secondary" id="cancel">取消</button>
      </div>
    </form>
    <p><a href="index.html">回未完工工單</a>　<a href="orders.html">回工單查詢</a></p>
  </main>
  <script src="js/common.js"></script>
  <script src="js/order.js"></script>
</body>
</html>
