<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>未結案清單｜品質異常回報管理系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav"></header>
  <!-- UI-02 open issues (home page) -->
  <main>
    <h1>未結案清單</h1>
    <div id="msg" class="msg" hidden></div>
    <div class="summary" id="summary"></div>
    <section class="panel">
      <div class="row">
        <label>狀態
          <select id="f-status">
            <option value="">全部</option>
            <option>待處理</option><option>處理中</option>
          </select>
        </label>
        <label>責任單位<select id="f-dept"></select></label>
        <label>異常類別<select id="f-type"></select></label>
        <button type="button" id="new-issue">登記異常</button>
      </div>
    </section>
    <table>
      <thead>
        <tr>
          <th>異常單號</th><th>發現時間</th><th>產線</th><th>產品</th><th>異常類別</th><th>異常描述</th>
          <th>影響數量</th><th>狀態</th><th>責任單位</th><th>經過天數</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
