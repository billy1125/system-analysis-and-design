<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>員工管理｜員工教育訓練紀錄系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav"></header>
  <!-- UI-08 employee accounts (HR only) -->
  <main>
    <h1>員工管理</h1>
    <div id="msg" class="msg" hidden></div>
    <form id="emp-form" class="panel">
      <h2 id="form-title">新增員工</h2>
      <div class="row">
        <label>員工編號<input name="emp_no" maxlength="5" placeholder="E0000"></label>
        <label>姓名<input name="name" maxlength="20"></label>
        <label>部門<input name="department" maxlength="20"></label>
        <label>職稱<input name="job_title" maxlength="20"></label>
      </div>
      <div class="row">
        <label>到職日<input name="hire_date" type="date"></label>
        <label>角色
          <select name="role">
            <option value="1">員工</option>
            <option value="0">人資</option>
          </select>
        </label>
        <label><span id="pw-label">密碼</span><input name="password" type="password" autocomplete="new-password"></label>
        <button type="submit">儲存</button>
        <button type="button" class="secondary" id="reset">清除</button>
      </div>
    </form>
    <table>
      <thead>
        <tr><th>員工編號</th><th>姓名</th><th>部門</th><th>職稱</th><th>到職日</th><th>角色</th><th>狀態</th><th>操作</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script src="js/common.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>
