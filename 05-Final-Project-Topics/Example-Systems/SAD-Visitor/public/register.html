<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>來訪登記｜工廠訪客進出登記系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav"></header>
  <!-- UI-03 check-in: both sections on one page -->
  <main>
    <h1>來訪登記</h1>
    <div id="msg" class="msg" hidden></div>

    <section class="panel">
      <h2>第一段：找訪客</h2>
      <form id="lookup-form">
        <div class="row">
          <label>手機號碼<input name="phone" maxlength="10" placeholder="09xxxxxxxx" autofocus></label>
          <button type="submit">查詢</button>
        </div>
      </form>
      <div id="lookup-result"></div>
    </section>

    <section class="panel">
      <h2>第二段：來訪資訊</h2>
      <form id="visit-form">
        <div class="row">
          <label>受訪員工<select name="employee_id"></select></label>
          <label>事由<select name="purpose"></select></label>
          <label>隨行人數<input name="companions" type="number" min="0" max="20" value="0"></label>
          <label>車牌<input name="plate_no" maxlength="10"></label>
        </div>
        <div class="row">
          <label>備註<textarea name="note" maxlength="200"></textarea></label>
        </div>
        <div class="row">
          <label>訪客證<select name="pass_id"></select></label>
          <button type="submit">登記並發證</button>
        </div>
      </form>
    </section>
  </main>
  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
