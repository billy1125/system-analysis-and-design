<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>梯次管理｜員工教育訓練紀錄系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav"></header>
  <!-- UI-04 session management (HR home page) -->
  <main>
    <h1>梯次管理</h1>
    <div id="msg" class="msg" hidden></div>
    <section class="panel">
      <div class="row">
        <label>課程<select id="f-course"></select></label>
        <label>梯次狀態
          <select id="f-status">
            <option value="">全部</option>
            <option>開放報名</option><option>截止報名</option><option>今日上課</option>
            <option>已結束</option><option>已取消</option>
          </select>
        </label>
        <button type="button" id="show-new">新增梯次</button>
      </div>
    </section>
    <form id="new-form" class="panel" hidden>
      <h2>新增梯次</h2>
      <div class="row">
        <label>課程<select name="course_id"></select></label>
        <label>上課日期<input name="session_date" type="date"></label>
        <label>開始時間<input name="start_time" type="time"></label>
        <label>結束時間<input name="end_time" type="time"></label>
      </div>
      <div class="row">
        <label>地點<input name="location" maxlength="30"></label>
        <label>講師<input name="instructor" maxlength="30"></label>
        <label>人數上限<input name="capacity" type="number" min="1" max="100"></label>
        <button type="submit">新增</button>
        <button type="button" class="secondary" id="hide-new">取消</button>
      </div>
    </form>
    <table>
      <thead>
        <tr><th>日期</th><th>時間</th><th>課程名稱</th><th>地點</th><th>講師</th><th>名額</th><th>梯次狀態</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script src="js/common.js"></script>
  <script src="js/sessions.js"></script>
</body>
</html>
