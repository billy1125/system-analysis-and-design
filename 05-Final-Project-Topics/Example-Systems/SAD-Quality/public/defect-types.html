<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>異常類別管理｜品質異常回報管理系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav"></header>
  <!-- UI-08 defect types (managers only) -->
  <main>
    <h1>異常類別管理</h1>
    <div id="msg" class="msg" hidden></div>
    <form id="type-form" class="panel">
      <h2 id="form-title">新增異常類別</h2>
      <div class="row">
        <label>類別名稱<input name="name" maxlength="10"></label>
        <button type="submit">儲存</button>
        <button type="button" class="secondary" id="reset">清除</button>
      </div>
    </form>
    <table>
      <thead>
        <tr><th>類別名稱</th><th>異常單數</th><th>狀態</th><th>操作</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script src="js/common.js"></script>
  <script src="js/defect-types.js"></script>
</body>
</html>
