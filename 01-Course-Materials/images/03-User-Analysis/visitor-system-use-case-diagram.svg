<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="14">
  <defs>
    <marker id="include" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
    <marker id="generalize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
    </marker>
    <g id="actor" fill="none" stroke="#333333" stroke-width="1.5">
      <circle cx="0" cy="-30" r="9" fill="#f3f3f3"/>
      <line x1="0" y1="-21" x2="0" y2="2"/>
      <line x1="-15" y1="-13" x2="15" y2="-13"/>
      <polyline points="-13,20 0,2 13,20"/>
    </g>
  </defs>
  <rect x="0" y="0" width="880" height="680" fill="#ffffff"/>

  <!-- system boundary -->
  <rect x="300" y="10" width="560" height="645" rx="4" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="580" y="32" text-anchor="middle" font-weight="bold" fill="#111111">工廠訪客進出登記系統</text>

  <!-- associations -->
  <g stroke="#333333" stroke-width="1.3">
    <line x1="216" y1="162" x2="373" y2="87"/>
    <line x1="216" y1="162" x2="370" y2="170"/>
    <line x1="216" y1="162" x2="373" y2="252"/>
    <line x1="96" y1="322" x2="370" y2="350"/>
    <line x1="216" y1="432" x2="370" y2="440"/>
    <line x1="216" y1="522" x2="370" y2="530"/>
    <line x1="216" y1="612" x2="370" y2="620"/>
  </g>

  <!-- actor generalization -->
  <line x1="92" y1="298" x2="183" y2="160" stroke="#333333" stroke-width="1.3" marker-end="url(#generalize)"/>

  <!-- include and extend -->
  <g fill="none" stroke="#333333" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#include)">
    <line x1="485" y1="92" x2="668" y2="158"/>
    <line x1="490" y1="170" x2="660" y2="170"/>
    <line x1="684" y1="62" x2="492" y2="77"/>
  </g>
  <g fill="#333333" font-size="13" text-anchor="middle">
    <text x="625" y="118">«include»</text>
    <text x="575" y="190">«include»</text>
    <text x="588" y="58">«extend»</text>
  </g>

  <!-- actors -->
  <use href="#actor" x="200" y="170"/>
  <use href="#actor" x="80" y="330"/>
  <use href="#actor" x="200" y="440"/>
  <use href="#actor" x="200" y="530"/>
  <use href="#actor" x="200" y="620"/>
  <g fill="#111111" text-anchor="middle">
    <text x="200" y="208">接待員</text>
    <text x="80" y="368">警衛室領班</text>
    <text x="200" y="478">訪客</text>
    <text x="200" y="568">受訪員工</text>
    <text x="200" y="658">人資系統</text>
  </g>

  <!-- use cases -->
  <g fill="#f3f3f3" stroke="#333333" stroke-width="1.5">
    <ellipse cx="430" cy="80" rx="60" ry="18"/>
    <ellipse cx="430" cy="170" rx="60" ry="18"/>
    <ellipse cx="430" cy="260" rx="60" ry="18"/>
    <ellipse cx="430" cy="350" rx="60" ry="18"/>
    <ellipse cx="430" cy="440" rx="60" ry="18"/>
    <ellipse cx="430" cy="530" rx="60" ry="18"/>
    <ellipse cx="430" cy="620" rx="60" ry="18"/>
    <ellipse cx="736" cy="170" rx="74" ry="18"/>
    <ellipse cx="736" cy="60" rx="50" ry="18"/>
  </g>
  <g fill="#111111" text-anchor="middle">
    <text x="430" y="85">辦理訪客報到</text>
    <text x="430" y="175">登記訪客離廠</text>
    <text x="430" y="265">查詢在廠訪客</text>
    <text x="430" y="355">更正報到紀錄</text>
    <text x="430" y="445">提出來訪申請</text>
    <text x="430" y="535">確認來訪申請</text>
    <text x="430" y="625">匯入員工名單</text>
    <text x="736" y="175">驗證接待員身分</text>
    <text x="736" y="65">現場建檔</text>
  </g>
</svg>
