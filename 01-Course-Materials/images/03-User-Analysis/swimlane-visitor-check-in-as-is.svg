<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 825" width="1160" height="825" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="825" fill="#ffffff"/>

  <!-- swimlanes -->
  <rect x="20" y="10" width="1120" height="40" fill="#f3f3f3"/>
  <g stroke="#333333" stroke-width="2">
    <line x1="20" y1="10" x2="20" y2="815"/>
    <line x1="300" y1="10" x2="300" y2="815"/>
    <line x1="580" y1="10" x2="580" y2="815"/>
    <line x1="860" y1="10" x2="860" y2="815"/>
    <line x1="1140" y1="10" x2="1140" y2="815"/>
    <line x1="20" y1="10" x2="1140" y2="10"/>
    <line x1="20" y1="50" x2="1140" y2="50"/>
    <line x1="20" y1="815" x2="1140" y2="815"/>
  </g>
  <g fill="#111111" font-size="18" text-anchor="middle">
    <text x="160" y="37">訪客</text>
    <text x="440" y="37">接待員</text>
    <text x="720" y="37">系統</text>
    <text x="1000" y="37">受訪員工</text>
  </g>

  <!-- flows -->
  <g fill="none" stroke="#333333" stroke-width="1.5">
    <line x1="160" y1="90" x2="160" y2="103" marker-end="url(#arrow)"/>
    <polyline points="160,141 160,153 440,153 440,163" marker-end="url(#arrow)"/>
    <polyline points="440,201 440,213 720,213 720,223" marker-end="url(#arrow)"/>
    <polyline points="720,261 720,273 440,273 440,283" marker-end="url(#arrow)"/>
    <line x1="440" y1="321" x2="440" y2="343" marker-end="url(#arrow)"/>
    <polyline points="440,381 440,393 1000,393 1000,403" marker-end="url(#arrow)"/>
    <polyline points="1000,441 1000,453 440,453 440,463" marker-end="url(#arrow)"/>
    <polyline points="440,501 440,513 720,513 720,523" marker-end="url(#arrow)"/>
    <polyline points="720,577 720,589 440,589 440,599" marker-end="url(#arrow)"/>
    <polyline points="440,637 440,649 160,649 160,659" marker-end="url(#arrow)"/>
    <polyline points="160,697 160,709 1000,709 1000,719" marker-end="url(#arrow)"/>
    <line x1="1000" y1="757" x2="1000" y2="777" marker-end="url(#arrow)"/>
  </g>

  <!-- start / end nodes -->
  <circle cx="160" cy="80" r="10" fill="#222222"/>
  <circle cx="1000" cy="791" r="12" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <circle cx="1000" cy="791" r="7" fill="#222222"/>

  <!-- actions -->
  <g fill="#f3f3f3" stroke="#333333" stroke-width="1.5">
    <rect x="69" y="105" width="182" height="36" rx="10"/>
    <rect x="370" y="165" width="140" height="36" rx="10"/>
    <rect x="608" y="225" width="224" height="36" rx="10"/>
    <rect x="321" y="285" width="238" height="36" rx="10"/>
    <rect x="363" y="345" width="154" height="36" rx="10"/>
    <rect x="916" y="405" width="168" height="36" rx="10"/>
    <rect x="314" y="465" width="252" height="36" rx="10"/>
    <rect x="615" y="525" width="210" height="52" rx="10"/>
    <rect x="391" y="601" width="98" height="36" rx="10"/>
    <rect x="55" y="661" width="210" height="36" rx="10"/>
    <rect x="951" y="721" width="98" height="36" rx="10"/>
  </g>
  <g fill="#111111" text-anchor="middle">
    <text x="160" y="128">告知手機號碼並出示證件</text>
    <text x="440" y="188">輸入手機號碼查詢</text>
    <text x="720" y="248">帶出訪客資料或顯示新訪客表單</text>
    <text x="440" y="308">核對證件，新訪客時輸入四項資料</text>
    <text x="440" y="368">打分機通知受訪員工</text>
    <text x="1000" y="428">接電話，同意出來接人</text>
    <text x="440" y="488">選擇受訪員工、事由、訪客證並送出</text>
    <text x="720" y="547">檢查欄位、訪客證與是否在廠</text>
    <text x="720" y="569">寫入來訪紀錄與報到時間</text>
    <text x="440" y="624">交付訪客證</text>
    <text x="160" y="684">掛上訪客證，等受訪員工來接</text>
    <text x="1000" y="744">到櫃台接人</text>
  </g>
</svg>
