<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="14">
  <rect x="0" y="0" width="800" height="260" fill="#ffffff"/>

  <g fill="none" stroke="#333333" stroke-width="1.5">
    <!-- attribute links -->
    <line x1="100" y1="70" x2="140" y2="110"/>
    <line x1="220" y1="70" x2="180" y2="110"/>
    <line x1="580" y1="70" x2="620" y2="110"/>
    <line x1="700" y1="70" x2="660" y2="110"/>
    <!-- relationship links -->
    <line x1="220" y1="135" x2="340" y2="135"/>
    <line x1="460" y1="135" x2="580" y2="135"/>
  </g>

  <!-- attributes -->
  <g fill="#ffffff" stroke="#333333" stroke-width="1.5">
    <ellipse cx="100" cy="50" rx="52" ry="20"/>
    <ellipse cx="220" cy="50" rx="52" ry="20"/>
    <ellipse cx="580" cy="50" rx="52" ry="20"/>
    <ellipse cx="700" cy="50" rx="52" ry="20"/>
  </g>
  <g fill="#111111" text-anchor="middle">
    <text x="100" y="55">電子郵件</text>
    <text x="220" y="55">姓名</text>
    <text x="580" y="55">標題</text>
    <text x="700" y="55">建立時間</text>
  </g>

  <!-- entities and relationship -->
  <g fill="#f3f3f3" stroke="#333333" stroke-width="1.5">
    <rect x="100" y="110" width="120" height="50"/>
    <rect x="580" y="110" width="120" height="50"/>
    <polygon points="340,135 400,101 460,135 400,169"/>
  </g>
  <g fill="#111111" text-anchor="middle" font-size="15">
    <text x="160" y="140">會員</text>
    <text x="640" y="140">文章</text>
    <text x="400" y="140">發表</text>
  </g>

  <!-- cardinality -->
  <g fill="#444444" font-size="13" text-anchor="middle">
    <text x="236" y="127">1</text>
    <text x="564" y="127">N</text>
  </g>

  <!-- legend -->
  <g fill="#f3f3f3" stroke="#999999" stroke-width="1">
    <rect x="100" y="216" width="30" height="20"/>
    <polygon points="340,226 356,216 372,226 356,236"/>
  </g>
  <ellipse cx="235" cy="226" rx="17" ry="10" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <g fill="#444444" font-size="13">
    <text x="138" y="231">實體</text>
    <text x="260" y="231">屬性</text>
    <text x="380" y="231">關係</text>
  </g>
</svg>
