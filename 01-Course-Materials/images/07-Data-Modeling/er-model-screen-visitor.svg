  <text x="450" y="288" font-size="13" fill="#444444">（欄位標題的底色：這一欄來自哪一張表）</text>

  <!-- notes -->
  <g fill="#444444" font-size="13">
    <text x="20" y="336">清單只列出離廠時間為空的來訪紀錄；畫面上沒有任何一欄存著「在廠」。</text>
    <text x="20" y="360">「訪客姓名」「受訪員工」「訪客證」都不是來訪紀錄裡存的值：來訪紀錄只存編號，畫面再用編號到另外三張表查出來。</text>
  </g>
