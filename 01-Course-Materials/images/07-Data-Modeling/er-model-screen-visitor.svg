    <text x="245" y="155" font-weight="bold">訪客姓名</text>
    <text x="340" y="155" font-weight="bold">公司</text>
    <text x="435" y="155" font-weight="bold">受訪員工</text>
    <text x="520" y="155" font-weight="bold">分機</text>
    <text x="600" y="155" font-weight="bold">訪客證</text>
    <text x="710" y="155" font-weight="bold">隨行人數</text>
    <text x="820" y="155" font-weight="bold">操作</text>
    <text x="120" y="186">2026-11-02 13:30</text>
    <text x="245" y="186">陳俊宏</text>
    <text x="340" y="186">永協機電</text>
    <text x="435" y="186">鄭大偉</text>
    <text x="520" y="186">2401</text>
    <text x="600" y="186">V-03</text>
    <text x="710" y="186">1</text>
    <text x="120" y="216">2026-11-04 08:55</text>
    <text x="245" y="216">張家豪</text>
    <text x="340" y="216">宏昇精密</text>
    <text x="435" y="216">李志明</text>
    <text x="520" y="216">2101</text>
    <text x="600" y="216">V-05</text>
