    <line x1="200" y1="134" x2="200" y2="256"/>
    <line x1="290" y1="134" x2="290" y2="256"/>
    <line x1="390" y1="134" x2="390" y2="256"/>
    <line x1="480" y1="134" x2="480" y2="256"/>
    <line x1="560" y1="134" x2="560" y2="256"/>
    <line x1="640" y1="134" x2="640" y2="256"/>
    <line x1="780" y1="134" x2="780" y2="256"/>
  </g>
  <line x1="40" y1="166" x2="860" y2="166" stroke="#333333" stroke-width="1"/>
  <rect x="40" y="134" width="820" height="122" fill="none" stroke="#333333" stroke-width="1.5"/>
  <g fill="#111111" text-anchor="middle">
