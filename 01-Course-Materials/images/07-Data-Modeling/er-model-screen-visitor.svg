  <g fill="#ffffff" stroke="#1f5fa8" stroke-width="1">
    <rect x="796" y="171" width="48" height="20" rx="4"/>
    <rect x="796" y="201" width="48" height="20" rx="4"/>
    <rect x="796" y="231" width="48" height="20" rx="4"/>
