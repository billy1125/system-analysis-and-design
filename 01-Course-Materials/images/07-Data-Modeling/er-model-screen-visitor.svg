  <!-- legend inside window -->
  <rect x="40" y="274" width="30" height="18" fill="#dde9f7" stroke="#999999" stroke-width="1"/>
  <text x="78" y="288" font-size="13" fill="#444444">來訪紀錄</text>
  <rect x="160" y="274" width="30" height="18" fill="#fff2c2" stroke="#999999" stroke-width="1"/>
  <text x="198" y="288" font-size="13" fill="#444444">訪客</text>
  <rect x="250" y="274" width="30" height="18" fill="#e3f1e0" stroke="#999999" stroke-width="1"/>
