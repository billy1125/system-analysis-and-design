      <text x="1065" y="855">顯示：訪客證 V-xx 已在使用中，請重新選擇</text>
      <text x="750" y="925">該訪客是否不在廠內</text>
      <text x="1065" y="925">顯示：此訪客目前仍在廠內，請先完成離廠登記</text>
