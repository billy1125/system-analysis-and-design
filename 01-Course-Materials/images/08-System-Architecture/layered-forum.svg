    <text x="480" y="76">桌機或筆電瀏覽器</text>
    <text x="730" y="76">桌機或筆電瀏覽器</text>
  </g>

  <!-- database -->
  <path d="M390,552 L390,612 A90,14 0 0,0 570,612 L570,552" fill="#f3f3f3" stroke="#333333" stroke-width="1.5"/>
  <ellipse cx="480" cy="552" rx="90" ry="14" fill="#f3f3f3" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="588" fill="#111111" text-anchor="middle" font-size="15">資料庫</text>
  <text x="480" y="607" fill="#444444" text-anchor="middle" font-size="13">單一檔案</text>
