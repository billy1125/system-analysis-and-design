<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="650" fill="#ffffff"/>

  <!-- containers -->
  <rect x="80" y="140" width="800" height="350" fill="#fafafa" stroke="#999999" stroke-width="1.5"/>
  <rect x="110" y="255" width="740" height="110" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <g fill="#444444" font-size="14">
    <text x="96" y="162">應用系統</text>
    <text x="126" y="277">五個子系統</text>
  </g>

  <!-- links -->
  <g fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="230" y1="90" x2="420" y2="168"/>
    <line x1="480" y1="90" x2="480" y2="168"/>
    <line x1="730" y1="90" x2="540" y2="168"/>
    <line x1="480" y1="215" x2="480" y2="253"/>
    <line x1="480" y1="365" x2="480" y2="413"/>
    <line x1="480" y1="460" x2="480" y2="536"/>
  </g>
  <g fill="#444444" font-size="13">
    <text x="278" y="128" text-anchor="end">HTTP 請求</text>
    <text x="490" y="134">HTTP 請求</text>
    <text x="682" y="128">HTTP 請求</text>
    <text x="490" y="512">讀寫</text>
  </g>

  <!-- boxes -->
  <g fill="#f3f3f3" stroke="#333333" stroke-width="1.5">
    <rect x="130" y="30" width="200" height="60"/>
    <rect x="380" y="30" width="200" height="60"/>
    <rect x="630" y="30" width="200" height="60"/>
    <rect x="380" y="170" width="200" height="45"/>
    <rect x="130" y="295" width="120" height="50"/>
    <rect x="275" y="295" width="120" height="50"/>
    <rect x="420" y="295" width="120" height="50"/>
    <rect x="565" y="295" width="120" height="50"/>
    <rect x="710" y="295" width="120" height="50"/>
    <rect x="380" y="415" width="200" height="45"/>
  </g>
  <g fill="#111111" text-anchor="middle" font-size="15">
