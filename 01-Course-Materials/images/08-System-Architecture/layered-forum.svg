    <text x="480" y="56">一般會員</text>
    <text x="730" y="56">管理員</text>
    <text x="480" y="198">路由與畫面產生</text>
    <text x="190" y="325">首頁</text>
    <text x="335" y="325">身分驗證</text>
    <text x="480" y="325">個人資料</text>
    <text x="625" y="325">會員管理</text>
    <text x="770" y="325">論壇</text>
    <text x="480" y="443">資料存取層</text>
  </g>
  <g fill="#444444" text-anchor="middle" font-size="13">
