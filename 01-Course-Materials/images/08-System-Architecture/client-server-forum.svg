    <text x="140" y="151">一般會員</text>
    <text x="140" y="241">管理員</text>
    <text x="510" y="150">論壇系統</text>
  </g>
  <g fill="#444444" text-anchor="middle" font-size="13">
    <text x="140" y="81">瀏覽器</text>
    <text x="140" y="171">瀏覽器</text>
    <text x="140" y="261">瀏覽器</text>
    <text x="510" y="172">應用伺服器</text>
  </g>

  <!-- database -->
  <path d="M760,125 L760,185 A70,14 0 0,0 900,185 L900,125" fill="#f3f3f3" stroke="#333333" stroke-width="1.5"/>
  <ellipse cx="830" cy="125" rx="70" ry="14" fill="#f3f3f3" stroke="#333333" stroke-width="1.5"/>
  <text x="830" y="167" fill="#111111" text-anchor="middle" font-size="15">資料庫</text>
