  <g fill="#111111" text-anchor="middle">
    <text x="450" y="60">瀏覽首頁</text>
    <text x="450" y="120">申請帳號</text>
    <text x="450" y="180">登入系統</text>
    <text x="450" y="240">瀏覽論壇</text>
    <text x="450" y="310">登出系統</text>
    <text x="450" y="370">查看個人資料</text>
    <text x="450" y="430">修改個人資料</text>
    <text x="450" y="490">發表文章</text>
    <text x="450" y="550">回覆文章</text>
    <text x="450" y="610">修改自己的文章或回覆</text>
    <text x="450" y="690">刪除文章或回覆</text>
    <text x="450" y="750">檢視會員清單</text>
    <text x="450" y="810">啟用或停用會員</text>
